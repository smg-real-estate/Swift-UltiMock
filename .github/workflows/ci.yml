name: CI

on:
  # Triggers the workflow on push or pull request events but only for the master branch
  push:
    branches: [ main, dev ]
  pull_request:
    branches: [ main ]

  # Allows you to run this workflow manually from the Actions tab
  workflow_dispatch:

jobs:
  test:
    runs-on: macos-26

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: "Fetch submodules"
        run: |
          git submodule sync
          git submodule update --init --recursive

      - uses: maxim-lobanov/setup-xcode@ed7a3b1fda3918c0306d1b724322adc0b8cc0a90 # v1.7.0
        with:
          xcode-version: '26.6'

      - name: Linting
        run: ./swiftformat . --lint

      - name: Unit Tests
        run: swift test

      - name: End-to-end tests macOS
        run: |
          cd PluginTests
          xcodebuild test -scheme PluginTests-Package -destination "platform=macOS"

      - name: End-to-end tests iOS
        run: |
          cd PluginTests
          xcodebuild test -scheme PluginTests-Package -destination 'platform=iOS Simulator,OS=26.5,name=iPhone 17'
